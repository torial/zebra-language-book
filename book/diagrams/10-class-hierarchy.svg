<?xml version="1.0" encoding="UTF-8"?>
<svg xml:space="preserve" viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-size: 24px; font-weight: bold; fill: #1f2937; }
      .base-box { fill: #fecaca; stroke: #dc2626; stroke-width: 2; }
      .child-box { fill: #bfdbfe; stroke: #0284c7; stroke-width: 2; }
      .grandchild-box { fill: #d1fae5; stroke: #059669; stroke-width: 2; }
      .label { font-size: 13px; fill: #374151; }
      .code { font-size: 12px; fill: #1f2937; font-family: 'Monaco', monospace; }
      .inherit-arrow { stroke: #6b7280; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .method-label { font-size: 10px; fill: #6b7280; font-style: italic; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#6b7280" />
    </marker>
  </defs>

  <text x="500" y="40" class="title" text-anchor="middle">Polymorphism Without Inheritance: interface + mixin</text>

  <!-- Base class -->
  <g>
    <rect x="350" y="80" width="300" height="140" class="base-box" rx="5"/>
    <text x="500" y="105" class="label" text-anchor="middle" font-weight="bold">interface Animal</text>
    <line x1="350" y1="115" x2="650" y2="115" stroke="#dc2626" stroke-width="1"/>
    <text x="365" y="135" class="code">def name(): str</text>
    <text x="365" y="155" class="code">def speak(): str</text>
    <text x="365" y="175" class="code">def move(): str</text>
    <text x="365" y="195" class="code"># a contract: no fields, no bodies</text>
    <text x="365" y="215" class="method-label">(what every Animal can do)</text>
  </g>

  <!-- Dog inherits from Animal -->
  <g>
    <!-- Inheritance line -->
    <path d="M 450 220 L 400 260" class="inherit-arrow"/>
    <path d="M 550 220 L 600 260" class="inherit-arrow"/>

    <!-- Dog class -->
    <rect x="250" y="270" width="300" height="160" class="child-box" rx="5"/>
    <text x="400" y="295" class="label" text-anchor="middle" font-weight="bold">class Dog implements Animal</text>
    <line x1="250" y1="305" x2="550" y2="305" stroke="#0284c7" stroke-width="1"/>
    <text x="265" y="325" class="code">    adds Sleeper</text>
    <text x="265" y="345" class="code">def speak(): str</text>
    <text x="265" y="365" class="code">  return "Woof!"</text>
    <text x="265" y="385" class="code">def fetch(item: str)</text>
    <text x="265" y="405" class="code">  # Dog-specific</text>
    <text x="265" y="425" class="method-label">(name, move, speak written here;</text>
    <text x="265" y="438" class="method-label">sleep comes from the mixin)</text>
  </g>

  <!-- Cat inherits from Animal -->
  <g>
    <!-- Inheritance line -->
    <path d="M 550 220 L 600 260" class="inherit-arrow"/>
    <path d="M 650 220 L 700 260" class="inherit-arrow"/>

    <!-- Cat class -->
    <rect x="550" y="270" width="300" height="160" class="child-box" rx="5"/>
    <text x="700" y="295" class="label" text-anchor="middle" font-weight="bold">class Cat implements Animal</text>
    <line x1="550" y1="305" x2="850" y2="305" stroke="#0284c7" stroke-width="1"/>
    <text x="565" y="325" class="code">    adds Sleeper</text>
    <text x="565" y="345" class="code">def speak(): str</text>
    <text x="565" y="365" class="code">  return "Meow!"</text>
    <text x="565" y="385" class="code">def scratch()</text>
    <text x="565" y="405" class="code">  # Cat-specific</text>
    <text x="565" y="425" class="method-label">(the same contract, its own</text>
    <text x="565" y="438" class="method-label">bodies; sleep from the mixin)</text>
  </g>

  <!-- Method resolution example -->
  <g>
    <text x="50" y="500" class="label" font-weight="bold">Shared behaviour is a mixin; polymorphism is the interface</text>

    <rect x="50" y="520" width="900" height="170" fill="#f9fafb" stroke="#d1d5db" stroke-width="1" rx="3"/>

    <text x="70" y="545" class="code">mixin Sleeper</text>
    <text x="70" y="565" class="code">  def sleep(): str</text>
    <text x="70" y="585" class="code">    return "zzz"                 # one body, mixed into Dog and Cat</text>
    <text x="70" y="605" class="code">var pets = List(Animal)()   # an interface-typed list</text>
    <text x="70" y="622" class="code">pets.add(Dog())</text>
    <text x="70" y="639" class="code">pets.add(Cat())</text>

    <text x="70" y="656" class="code">for p in pets</text>
    <text x="70" y="673" class="code">    print(p.speak())   # "Woof!" then "Meow!" -- no super, no extends</text>
  </g>
</svg>
