# Build the book with mdBook and publish it to GitHub Pages.
#
# One-time repo setting required: Settings -> Pages -> Build and deployment ->
# Source: "GitHub Actions". Until that is flipped, Pages keeps serving the old
# Jekyll build of the main branch (which is what rendered README.md at the root).
name: Publish book to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  MDBOOK_VERSION: v0.4.52

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install mdBook (prebuilt release)
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSL "https://github.com/rust-lang/mdBook/releases/download/${MDBOOK_VERSION}/mdbook-${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build
        run: mdbook build

      - name: Sanity-check output
        run: |
          test -f public/index.html
          test -f public/Part-1-Foundations/01-Getting-Started.html
          # Every chapter listed in SUMMARY.md must have produced a page.
          grep -oE '\]\([^)]+\.md\)' book/SUMMARY.md | sed -E 's/^\]\((.*)\.md\)$/\1/' | while read -r p; do
            test -f "public/$p.html" || { echo "missing public/$p.html"; exit 1; }
          done

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
